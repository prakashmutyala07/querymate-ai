<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1550" viewBox="0 0 1300 1550" role="img" aria-labelledby="title desc">
  <title id="title">QueryMate AI - POC Architecture</title>
  <desc id="desc">Vertical workflow diagram showing application-controlled LLM orchestration, secure MCP boundary, and read-only SQL Server access.</desc>
  <defs>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0e8088"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#10739e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b7791f"/>
    </marker>
    <marker id="arrowReturn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
      .box-title { font-size: 17px; font-weight: 700; }
      .box-body { font-size: 13px; }
      .small { font-size: 11px; }
      .app-title { font-size: 21px; font-weight: 700; fill: #1b5e20; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrowSlate); }
      .edge-green { fill: none; stroke: #2e7d32; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .edge-teal { fill: none; stroke: #0e8088; stroke-width: 2.5; marker-end: url(#arrowTeal); }
      .edge-blue { fill: none; stroke: #10739e; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .edge-orange { fill: none; stroke: #b7791f; stroke-width: 2.5; marker-end: url(#arrowOrange); }
      .edge-optional { fill: none; stroke: #b7791f; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrowOrange); }
      .edge-return { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrowReturn); }
      .label-bg { fill: #ffffff; stroke: none; }
      .badge { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .badge-green { fill: #2e7d32; stroke: #ffffff; stroke-width: 3; }
      .badge-teal { fill: #0e8088; stroke: #ffffff; stroke-width: 3; }
      .badge-orange { fill: #b7791f; stroke: #ffffff; stroke-width: 3; }
      .badge-text { fill: #ffffff; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1300" height="1550" fill="#ffffff"/>
  <text x="70" y="58" class="title">QueryMate AI - POC Architecture</text>
  <text x="70" y="92" class="subtitle">Application-controlled LLM orchestration with secure MCP boundary and read-only data access</text>

  <text x="505" y="160" text-anchor="middle" class="section" fill="#3f5f91">User Experience</text>
  <rect x="405" y="185" width="200" height="78" rx="8" fill="#e8f1ff" stroke="#5b7cba" stroke-width="2"/>
  <text x="505" y="231" text-anchor="middle" class="box-title">Business User</text>
  <rect x="405" y="330" width="200" height="78" rx="8" fill="#e8f1ff" stroke="#5b7cba" stroke-width="2"/>
  <text x="505" y="360" text-anchor="middle" class="box-title">Chat UI</text>
  <text x="505" y="384" text-anchor="middle" class="box-body" fill="#475569">Natural language Q&amp;A</text>

  <path class="edge" d="M505 263 L505 330"/>
  <circle class="badge" cx="542" cy="296" r="17"/><text class="badge-text" x="542" y="296">1</text>
  <rect class="label-bg" x="388" y="286" width="112" height="20"/><text x="444" y="301" text-anchor="middle" class="box-body" fill="#334155">User asks</text>

  <rect x="250" y="480" width="510" height="600" rx="10" fill="#f4fbf6" stroke="#2e7d32" stroke-width="3"/>
  <text x="280" y="522" class="app-title">QueryMate AI Application</text>
  <rect x="325" y="565" width="360" height="58" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="505" y="590" text-anchor="middle" class="box-title">ChatController</text>
  <text x="505" y="611" text-anchor="middle" class="box-body" fill="#33691e">Request validation</text>
  <rect x="325" y="650" width="360" height="58" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="505" y="675" text-anchor="middle" class="box-title">ChatCoordinator</text>
  <text x="505" y="696" text-anchor="middle" class="box-body" fill="#33691e">Controls chat turn</text>
  <rect x="325" y="735" width="360" height="150" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="505" y="765" text-anchor="middle" class="box-title">Safety &amp; Governance Controls</text>
  <text x="505" y="792" text-anchor="middle" class="box-body" fill="#33691e">PII Detection</text>
  <text x="505" y="815" text-anchor="middle" class="box-body" fill="#33691e">Request Token Context</text>
  <text x="505" y="838" text-anchor="middle" class="box-body" fill="#33691e">Secure MCP Tool Boundary</text>
  <text x="505" y="861" text-anchor="middle" class="box-body" fill="#33691e">Tool Result Protection</text>
  <rect x="325" y="915" width="360" height="58" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="505" y="940" text-anchor="middle" class="box-title">PromptProvider + ChatModelRunner</text>
  <text x="505" y="961" text-anchor="middle" class="box-body" fill="#33691e">System prompt - masked context</text>
  <rect x="325" y="1000" width="170" height="58" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="410" y="1025" text-anchor="middle" class="box-title">Structured Response</text>
  <text x="410" y="1046" text-anchor="middle" class="box-body" fill="#33691e">Status - rows - notes</text>
  <rect x="515" y="1000" width="170" height="58" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="600" y="1025" text-anchor="middle" class="box-title">Sanitized Memory</text>
  <text x="600" y="1046" text-anchor="middle" class="small" fill="#33691e">Protected follow-up context</text>

  <path class="edge" d="M505 408 L505 565"/>
  <circle class="badge" cx="542" cy="445" r="17"/><text class="badge-text" x="542" y="445">2</text>
  <rect class="label-bg" x="378" y="435" width="124" height="20"/><text x="440" y="450" text-anchor="middle" class="box-body" fill="#334155">UI sends request</text>
  <path class="edge-green" d="M505 623 L505 650"/>
  <path class="edge-green" d="M505 708 L505 735"/>
  <circle class="badge-green" cx="542" cy="722" r="17"/><text class="badge-text" x="542" y="722">3</text>
  <rect class="label-bg" x="350" y="709" width="154" height="20"/><text x="427" y="724" text-anchor="middle" class="box-body" fill="#2e7d32">Validate and protect</text>
  <path class="edge-green" d="M505 885 L505 915"/>
  <path class="edge-green" d="M505 973 L505 1000"/>

  <text x="980" y="500" text-anchor="middle" class="section" fill="#7f6000">Model Provider</text>
  <rect x="850" y="535" width="260" height="100" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="980" y="572" text-anchor="middle" class="box-title">OpenAI API</text>
  <text x="980" y="598" text-anchor="middle" class="box-body" fill="#7f6000">Primary: gpt-4.1-mini</text>
  <text x="980" y="619" text-anchor="middle" class="box-body" fill="#7f6000">Fallback: gpt-4.1-nano</text>
  <rect x="820" y="690" width="320" height="116" fill="#fdecea" stroke="#c62828" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="980" y="722" text-anchor="middle" class="box-body" font-weight="700" fill="#b71c1c">LLM has no direct access to DAB, MCP tools,</text>
  <text x="980" y="744" text-anchor="middle" class="box-body" font-weight="700" fill="#b71c1c">SQL Server, websites, or internal APIs.</text>
  <text x="980" y="772" text-anchor="middle" class="box-body" fill="#b71c1c">Tool execution is controlled by the application.</text>

  <path class="edge-orange" d="M685 944 L795 944 L795 570 L850 570"/>
  <circle class="badge-orange" cx="795" cy="820" r="17"/><text class="badge-text" x="795" y="820">4</text>
  <rect class="label-bg" x="713" y="790" width="164" height="34"/><text x="795" y="803" text-anchor="middle" class="box-body" fill="#7f6000">Masked prompt/context</text>
  <path class="edge" d="M850 600 L780 600 L780 944 L685 944"/>
  <circle class="badge" cx="780" cy="858" r="17"/><text class="badge-text" x="780" y="858">5</text>
  <rect class="label-bg" x="700" y="836" width="160" height="50"/><text x="780" y="849" text-anchor="middle" class="box-body" fill="#334155">Text / structured</text><text x="780" y="866" text-anchor="middle" class="box-body" fill="#334155">response or tool intent</text>

  <text x="505" y="1160" text-anchor="middle" class="section" fill="#0e5c61">Data Access</text>
  <rect x="365" y="1190" width="280" height="74" rx="8" fill="#d5f0f3" stroke="#0e8088" stroke-width="2"/>
  <text x="505" y="1220" text-anchor="middle" class="box-title">DAB MCP Tools</text>
  <text x="505" y="1243" text-anchor="middle" class="box-body" fill="#0e5c61">describe - read - aggregate</text>
  <rect x="365" y="1310" width="280" height="74" rx="8" fill="#d5f0f3" stroke="#0e8088" stroke-width="2"/>
  <text x="505" y="1340" text-anchor="middle" class="box-title">Microsoft Data API Builder</text>
  <text x="505" y="1363" text-anchor="middle" class="box-body" fill="#0e5c61">Controlled data API</text>
  <path d="M390 1435 C390 1405,620 1405,620 1435 L620 1485 C620 1515,390 1515,390 1485 Z" fill="#cfe8f6" stroke="#10739e" stroke-width="2"/>
  <ellipse cx="505" cy="1435" rx="115" ry="30" fill="#d9eef8" stroke="#10739e" stroke-width="2"/>
  <text x="505" y="1468" text-anchor="middle" class="box-title">SQL Server</text>
  <text x="505" y="1491" text-anchor="middle" class="box-body" fill="#0b4f6c">Read-only access</text>

  <path class="edge-green" d="M505 1080 L505 1190"/>
  <circle class="badge-green" cx="542" cy="1135" r="17"/><text class="badge-text" x="542" y="1135">6</text>
  <rect class="label-bg" x="343" y="1124" width="160" height="20"/><text x="423" y="1139" text-anchor="middle" class="box-body" fill="#2e7d32">Approved tool execution</text>
  <path class="edge-teal" d="M505 1264 L505 1310"/>
  <path class="edge-blue" d="M505 1384 L505 1405"/>
  <circle class="badge-teal" cx="542" cy="1288" r="17"/><text class="badge-text" x="542" y="1288">7</text>
  <rect class="label-bg" x="350" y="1278" width="152" height="20"/><text x="426" y="1293" text-anchor="middle" class="box-body" fill="#0e8088">DAB reads approved data</text>
  <rect class="label-bg" x="544" y="1386" width="96" height="20"/><text x="592" y="1401" text-anchor="middle" class="box-body" fill="#0b4f6c">Read-only</text>

  <path class="edge-return" d="M645 1227 L735 1227 L735 810 L685 810"/>
  <circle class="badge" cx="735" cy="1020" r="17"/><text class="badge-text" x="735" y="1020">8</text>
  <rect class="label-bg" x="750" y="992" width="124" height="36"/><text x="812" y="1006" text-anchor="middle" class="box-body" fill="#64748b">Protected tool</text><text x="812" y="1023" text-anchor="middle" class="box-body" fill="#64748b">result returns</text>
  <circle class="badge-green" cx="705" cy="862" r="17"/><text class="badge-text" x="705" y="862">9</text>
  <rect class="label-bg" x="720" y="832" width="164" height="36"/><text x="802" y="846" text-anchor="middle" class="box-body" fill="#2e7d32">Protect tool results</text><text x="802" y="863" text-anchor="middle" class="box-body" fill="#2e7d32">before LLM reuse</text>
  <path class="edge-optional" d="M685 1029 L805 1029 L805 620 L850 620"/>
  <rect class="label-bg" x="706" y="995" width="176" height="36"/><text x="794" y="1009" text-anchor="middle" class="box-body" fill="#7f6000">Protected result to LLM</text><text x="794" y="1026" text-anchor="middle" class="box-body" fill="#7f6000">if needed</text>

  <path class="edge-return" d="M325 1029 L195 1029 L195 370 L405 370"/>
  <path class="edge-return" d="M405 370 L195 370 L195 224 L405 224"/>
  <circle class="badge" cx="195" cy="700" r="17"/><text class="badge-text" x="195" y="700">10</text>
  <rect class="label-bg" x="76" y="666" width="134" height="36"/><text x="143" y="680" text-anchor="middle" class="box-body" fill="#64748b">Rehydrate and</text><text x="143" y="697" text-anchor="middle" class="box-body" fill="#64748b">return answer</text>
</svg>
