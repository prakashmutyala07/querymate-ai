<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">QueryMate AI - POC Architecture</title>
  <desc id="desc">Management architecture showing numbered natural-language question flow, application-controlled LLM orchestration, a secure MCP boundary, Data API Builder, and read-only SQL Server access.</desc>
  <defs>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0e8088"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#10739e"/>
    </marker>
    <marker id="arrowReturn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .band { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      .box-title { font-size: 16px; font-weight: 700; }
      .box-body { font-size: 12px; }
      .small { font-size: 10px; }
      .app-title { font-size: 19px; font-weight: 700; fill: #1b5e20; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrowSlate); }
      .edge-green { fill: none; stroke: #2e7d32; stroke-width: 2.4; marker-end: url(#arrowGreen); }
      .edge-teal { fill: none; stroke: #0e8088; stroke-width: 2.4; marker-end: url(#arrowTeal); }
      .edge-blue { fill: none; stroke: #10739e; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .edge-return { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrowReturn); }
      .edge-model { fill: none; stroke: #b7791f; stroke-width: 2.4; marker-end: url(#arrowSlate); }
      .label-bg { fill: #ffffff; stroke: none; }
      .badge { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
      .badge-green { fill: #2e7d32; stroke: #ffffff; stroke-width: 3; }
      .badge-teal { fill: #0e8088; stroke: #ffffff; stroke-width: 3; }
      .badge-orange { fill: #b7791f; stroke: #ffffff; stroke-width: 3; }
      .badge-text { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#ffffff"/>
  <text x="60" y="54" class="title">QueryMate AI - POC Architecture</text>
  <text x="60" y="84" class="subtitle">Management view: natural-language questions, application-controlled LLM orchestration, secure MCP boundary, and approved read-only data access</text>

  <text x="260" y="350" text-anchor="middle" class="band" fill="#3f5f91">User Experience</text>
  <rect x="70" y="405" width="165" height="76" rx="8" fill="#e8f1ff" stroke="#5b7cba" stroke-width="2"/>
  <text x="152.5" y="449" text-anchor="middle" class="box-title">Business User</text>
  <rect x="315" y="405" width="185" height="76" rx="8" fill="#e8f1ff" stroke="#5b7cba" stroke-width="2"/>
  <text x="407.5" y="435" text-anchor="middle" class="box-title">Chat UI</text>
  <text x="407.5" y="458" text-anchor="middle" class="box-body" fill="#475569">Natural language Q&amp;A</text>

  <rect x="290" y="245" width="230" height="88" rx="8" fill="#f3f4f6" stroke="#8a8f98" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="405" y="276" text-anchor="middle" class="box-title" fill="#5b6472">Authentication / OIDC</text>
  <text x="405" y="299" text-anchor="middle" class="box-body" fill="#5b6472">Future production capability</text>
  <text x="405" y="318" text-anchor="middle" class="box-body" fill="#5b6472">Not in current POC</text>

  <rect x="590" y="170" width="520" height="600" rx="8" fill="#f4fbf6" stroke="#2e7d32" stroke-width="3"/>
  <text x="615" y="207" class="app-title">QueryMate AI Application</text>
  <rect x="635" y="245" width="175" height="64" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="722.5" y="273" text-anchor="middle" class="box-title">ChatController</text>
  <text x="722.5" y="294" text-anchor="middle" class="box-body" fill="#33691e">Request validation</text>
  <rect x="885" y="245" width="180" height="64" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="975" y="273" text-anchor="middle" class="box-title">ChatCoordinator</text>
  <text x="975" y="294" text-anchor="middle" class="box-body" fill="#33691e">Controls chat turn</text>
  <rect x="635" y="375" width="430" height="155" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="850" y="405" text-anchor="middle" class="box-title">Safety &amp; Governance Controls</text>
  <text x="850" y="431" text-anchor="middle" class="box-body" fill="#33691e">PII Detection</text>
  <text x="850" y="452" text-anchor="middle" class="box-body" fill="#33691e">Request Token Context</text>
  <text x="850" y="473" text-anchor="middle" class="box-body" fill="#33691e">Secure MCP Tool Boundary</text>
  <text x="850" y="494" text-anchor="middle" class="box-body" fill="#33691e">Tool Result Protection</text>
  <text x="850" y="516" text-anchor="middle" class="small" fill="#4f6f37">PiiDetector - SensitiveRequestContext - SecureMcpToolCallback - SensitivePayloadProtector</text>
  <rect x="635" y="575" width="430" height="64" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="850" y="603" text-anchor="middle" class="box-title">PromptProvider + ChatModelRunner</text>
  <text x="850" y="624" text-anchor="middle" class="box-body" fill="#33691e">System prompt - masked context - guarded tools</text>
  <rect x="635" y="680" width="190" height="64" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="730" y="707" text-anchor="middle" class="box-title">Structured Response</text>
  <text x="730" y="728" text-anchor="middle" class="box-body" fill="#33691e">Status - rows - notes</text>
  <rect x="875" y="680" width="190" height="64" rx="8" fill="#d9ead3" stroke="#82b366" stroke-width="2"/>
  <text x="970" y="703" text-anchor="middle" class="box-title">Sanitized Memory</text>
  <text x="970" y="726" text-anchor="middle" class="box-body" fill="#33691e">Protected follow-up context</text>

  <text x="1345" y="275" text-anchor="middle" class="band" fill="#7f6000">Model Provider</text>
  <rect x="1225" y="315" width="240" height="96" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="1345" y="350" text-anchor="middle" class="box-title">OpenAI API</text>
  <text x="1345" y="376" text-anchor="middle" class="box-body" fill="#7f6000">Primary: gpt-4.1-mini</text>
  <text x="1345" y="396" text-anchor="middle" class="box-body" fill="#7f6000">Fallback: gpt-4.1-nano</text>
  <rect x="1195" y="465" width="300" height="110" fill="#fdecea" stroke="#c62828" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="1345" y="495" text-anchor="middle" class="box-body" font-weight="700" fill="#b71c1c">LLM has no direct access to DAB,</text>
  <text x="1345" y="514" text-anchor="middle" class="box-body" font-weight="700" fill="#b71c1c">MCP tools, SQL Server, websites,</text>
  <text x="1345" y="533" text-anchor="middle" class="box-body" font-weight="700" fill="#b71c1c">or internal APIs.</text>
  <text x="1345" y="558" text-anchor="middle" class="box-body" fill="#b71c1c">Tool execution is controlled by the application.</text>

  <text x="1640" y="275" text-anchor="middle" class="band" fill="#0e5c61">Data Access</text>
  <rect x="1530" y="315" width="220" height="86" rx="8" fill="#d5f0f3" stroke="#0e8088" stroke-width="2"/>
  <text x="1640" y="350" text-anchor="middle" class="box-title">DAB MCP Tools</text>
  <text x="1640" y="375" text-anchor="middle" class="box-body" fill="#0e5c61">describe - read - aggregate</text>
  <rect x="1510" y="595" width="260" height="86" rx="8" fill="#d5f0f3" stroke="#0e8088" stroke-width="2"/>
  <text x="1640" y="630" text-anchor="middle" class="box-title">Microsoft Data API Builder</text>
  <text x="1640" y="655" text-anchor="middle" class="box-body" fill="#0e5c61">Controlled data API</text>
  <path d="M1540 810 C1540 780,1740 780,1740 810 L1740 890 C1740 920,1540 920,1540 890 Z" fill="#cfe8f6" stroke="#10739e" stroke-width="2"/>
  <ellipse cx="1640" cy="810" rx="100" ry="30" fill="#d9eef8" stroke="#10739e" stroke-width="2"/>
  <text x="1640" y="845" text-anchor="middle" class="box-title">SQL Server</text>
  <text x="1640" y="871" text-anchor="middle" class="box-body" fill="#0b4f6c">Read-only access</text>

  <path class="edge" d="M235 443 L315 443"/>
  <circle class="badge" cx="275" cy="423" r="16"/><text class="badge-text" x="275" y="423">1</text>
  <rect class="label-bg" x="248" y="392" width="102" height="18"/><text x="299" y="405" text-anchor="middle" class="box-body" fill="#334155">User asks</text>
  <path class="edge" d="M500 443 L545 443 L545 277 L635 277"/>
  <circle class="badge" cx="548" cy="392" r="16"/><text class="badge-text" x="548" y="392">2</text>
  <rect class="label-bg" x="498" y="360" width="118" height="18"/><text x="557" y="373" text-anchor="middle" class="box-body" fill="#334155">UI sends request</text>
  <path class="edge" d="M810 277 L885 277"/>
  <path class="edge-green" d="M975 309 L975 345 L850 345 L850 375"/>
  <circle class="badge-green" cx="900" cy="348" r="16"/><text class="badge-text" x="900" y="348">3</text>
  <rect class="label-bg" x="787" y="318" width="150" height="18"/><text x="862" y="331" text-anchor="middle" class="box-body" fill="#2e7d32">Application protects request</text>
  <path class="edge-green" d="M850 530 L850 575"/>
  <path class="edge-model" d="M1065 607 L1150 607 L1150 363 L1225 363"/>
  <circle class="badge-orange" cx="1150" cy="422" r="16"/><text class="badge-text" x="1150" y="422">4</text>
  <rect class="label-bg" x="1078" y="392" width="145" height="32"/><text x="1150.5" y="405" text-anchor="middle" class="box-body" fill="#7f6000">Masked prompt</text><text x="1150.5" y="420" text-anchor="middle" class="box-body" fill="#7f6000">and context</text>
  <path class="edge" d="M1225 388 L1175 388 L1175 628 L1065 628"/>
  <circle class="badge" cx="1175" cy="500" r="16"/><text class="badge-text" x="1175" y="500">5</text>
  <rect class="label-bg" x="1100" y="468" width="150" height="34"/><text x="1175" y="481" text-anchor="middle" class="box-body" fill="#334155">Text / structured</text><text x="1175" y="496" text-anchor="middle" class="box-body" fill="#334155">response or intent</text>
  <path class="edge-green" d="M1065 455 L1180 455 L1180 255 L1640 255 L1640 315"/>
  <circle class="badge-green" cx="1255" cy="255" r="16"/><text class="badge-text" x="1255" y="255">6</text>
  <rect class="label-bg" x="1280" y="245" width="160" height="20"/><text x="1360" y="260" text-anchor="middle" class="box-body" fill="#2e7d32">Approved tool execution</text>
  <path class="edge-teal" d="M1640 401 L1640 595"/>
  <path class="edge-blue" d="M1640 681 L1640 780"/>
  <circle class="badge-teal" cx="1665" cy="510" r="16"/><text class="badge-text" x="1665" y="510">7</text>
  <rect class="label-bg" x="1684" y="501" width="92" height="18"/><text x="1730" y="514" text-anchor="middle" class="box-body" fill="#0e8088">DAB reads</text>
  <rect class="label-bg" x="1650" y="725" width="76" height="20"/><text x="1688" y="740" text-anchor="middle" class="box-body" fill="#0b4f6c">Read-only</text>
  <path class="edge-return" d="M1540 852 L1470 852 L1470 720 L1640 720 L1640 681"/>
  <path class="edge-return" d="M1695 595 L1695 401"/>
  <path class="edge-return" d="M1530 345 L1490 345 L1490 225 L1110 225 L1110 435"/>
  <circle class="badge" cx="1490" cy="225" r="16"/><text class="badge-text" x="1490" y="225">8</text>
  <rect class="label-bg" x="1320" y="198" width="145" height="34"/><text x="1392.5" y="211" text-anchor="middle" class="box-body" fill="#64748b">Protected result</text><text x="1392.5" y="226" text-anchor="middle" class="box-body" fill="#64748b">returns via MCP</text>
  <path class="edge-model" d="M1065 712 L1130 712 L1130 385 L1225 385"/>
  <circle class="badge-orange" cx="1130" cy="682" r="16"/><text class="badge-text" x="1130" y="682">9</text>
  <rect class="label-bg" x="1046" y="650" width="168" height="34"/><text x="1130" y="663" text-anchor="middle" class="box-body" fill="#7f6000">Protected result to LLM</text><text x="1130" y="678" text-anchor="middle" class="box-body" fill="#7f6000">if needed</text>
  <path class="edge-return" d="M635 712 L560 712 L560 530 L407 530 L407 481"/>
  <path class="edge-return" d="M407 481 L407 530 L152.5 530 L152.5 481"/>
  <circle class="badge" cx="520" cy="585" r="16"/><text class="badge-text" x="520" y="585">10</text>
  <rect class="label-bg" x="430" y="554" width="166" height="34"/><text x="513" y="567" text-anchor="middle" class="box-body" fill="#64748b">Rehydrate and return</text><text x="513" y="582" text-anchor="middle" class="box-body" fill="#64748b">final answer</text>
  <path d="M405 333 L405 405" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowSlate)"/>
</svg>
