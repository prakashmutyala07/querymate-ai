<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">QueryMate AI - POC Architecture</title>
  <desc id="desc">Management-level architecture diagram showing application-controlled LLM orchestration, secure MCP boundary, and read-only data access.</desc>
  <defs>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0e8088"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#10739e"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b7791f"/>
    </marker>
    <marker id="arrowReturn" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #475569; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
      .box-title { font-size: 18px; font-weight: 700; }
      .box-body { font-size: 14px; }
      .small { font-size: 12px; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.6; marker-end: url(#arrowSlate); }
      .edge-green { fill: none; stroke: #2e7d32; stroke-width: 2.6; marker-end: url(#arrowGreen); }
      .edge-teal { fill: none; stroke: #0e8088; stroke-width: 2.6; marker-end: url(#arrowTeal); }
      .edge-blue { fill: none; stroke: #10739e; stroke-width: 2.6; marker-end: url(#arrowBlue); }
      .edge-orange { fill: none; stroke: #b7791f; stroke-width: 2.6; marker-end: url(#arrowOrange); }
      .edge-return { fill: none; stroke: #64748b; stroke-width: 2.6; marker-end: url(#arrowReturn); }
      .future { fill: #f3f4f6; stroke: #8a8f98; stroke-width: 2; stroke-dasharray: 7 5; }
      .label-bg { fill: #ffffff; stroke: none; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="60" y="56" class="title">QueryMate AI - POC Architecture</text>
  <text x="60" y="88" class="subtitle">Application-controlled LLM orchestration with secure MCP boundary and read-only data access</text>

  <rect x="845" y="48" width="260" height="72" rx="8" class="future"/>
  <text x="975" y="78" text-anchor="middle" class="box-body" font-weight="700" fill="#5b6472">Authentication / OIDC</text>
  <text x="975" y="101" text-anchor="middle" class="small" fill="#5b6472">Future capability outside current POC</text>

  <text x="250" y="160" text-anchor="middle" class="section" fill="#3f5f91">User Experience</text>
  <rect x="130" y="190" width="240" height="74" rx="8" fill="#e8f1ff" stroke="#5b7cba" stroke-width="2"/>
  <text x="250" y="234" text-anchor="middle" class="box-title">Business User</text>

  <rect x="130" y="320" width="240" height="74" rx="8" fill="#e8f1ff" stroke="#5b7cba" stroke-width="2"/>
  <text x="250" y="349" text-anchor="middle" class="box-title">Chat UI</text>
  <text x="250" y="373" text-anchor="middle" class="box-body" fill="#475569">Natural-language questions</text>

  <rect x="110" y="455" width="520" height="205" rx="10" fill="#f4fbf6" stroke="#2e7d32" stroke-width="3"/>
  <text x="370" y="495" text-anchor="middle" class="box-title" fill="#1b5e20">QueryMate AI Application</text>
  <text x="370" y="532" text-anchor="middle" class="box-body" fill="#33691e">Request validation</text>
  <text x="370" y="560" text-anchor="middle" class="box-body" fill="#33691e">PII masking and rehydration</text>
  <text x="370" y="588" text-anchor="middle" class="box-body" fill="#33691e">Application-controlled LLM orchestration</text>
  <text x="370" y="616" text-anchor="middle" class="box-body" fill="#33691e">Secure MCP tool boundary</text>
  <text x="370" y="644" text-anchor="middle" class="box-body" fill="#33691e">Structured response</text>

  <text x="875" y="430" text-anchor="middle" class="section" fill="#7f6000">LLM Provider</text>
  <rect x="720" y="455" width="310" height="110" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
  <text x="875" y="493" text-anchor="middle" class="box-title">OpenAI API currently</text>
  <text x="875" y="521" text-anchor="middle" class="box-body" fill="#7f6000">CA-GIP LLM-as-a-Service</text>
  <text x="875" y="543" text-anchor="middle" class="box-body" fill="#7f6000">planned for Phase 3</text>

  <rect x="710" y="600" width="330" height="86" fill="#fdecea" stroke="#c62828" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="875" y="628" text-anchor="middle" class="small" font-weight="700" fill="#b71c1c">LLM has no direct access to DAB, MCP tools,</text>
  <text x="875" y="648" text-anchor="middle" class="small" font-weight="700" fill="#b71c1c">SQL Server, websites, or internal APIs.</text>
  <text x="875" y="671" text-anchor="middle" class="small" fill="#b71c1c">Tool execution is controlled by the application.</text>

  <path class="edge" d="M250 264 L250 320"/>
  <rect class="label-bg" x="154" y="282" width="92" height="20"/><text x="200" y="297" text-anchor="middle" class="box-body" fill="#334155">User asks</text>

  <path class="edge" d="M250 394 L250 455"/>

  <rect class="label-bg" x="166" y="521" width="138" height="22"/><text x="235" y="537" text-anchor="middle" class="box-body" fill="#2e7d32">App protects request</text>

  <path class="edge-orange" d="M630 520 L720 520"/>
  <rect class="label-bg" x="626" y="480" width="146" height="20"/><text x="699" y="495" text-anchor="middle" class="box-body" fill="#7f6000">Masked prompt/context</text>

  <path class="edge" d="M720 552 L630 552"/>
  <rect class="label-bg" x="618" y="584" width="158" height="20"/><text x="697" y="599" text-anchor="middle" class="box-body" fill="#334155">Response or tool request</text>

  <text x="565" y="725" text-anchor="middle" class="section" fill="#0e5c61">Data Access</text>
  <rect x="110" y="755" width="250" height="76" rx="8" fill="#d5f0f3" stroke="#0e8088" stroke-width="2"/>
  <text x="235" y="786" text-anchor="middle" class="box-title">DAB MCP Tools</text>
  <text x="235" y="811" text-anchor="middle" class="box-body" fill="#0e5c61">approved read operations</text>

  <rect x="460" y="755" width="270" height="76" rx="8" fill="#d5f0f3" stroke="#0e8088" stroke-width="2"/>
  <text x="595" y="786" text-anchor="middle" class="box-title">Microsoft Data API Builder</text>
  <text x="595" y="811" text-anchor="middle" class="box-body" fill="#0e5c61">controlled data API</text>

  <path d="M835 790 C835 760,1065 760,1065 790 L1065 848 C1065 878,835 878,835 848 Z" fill="#cfe8f6" stroke="#10739e" stroke-width="2"/>
  <ellipse cx="950" cy="790" rx="115" ry="30" fill="#d9eef8" stroke="#10739e" stroke-width="2"/>
  <text x="950" y="824" text-anchor="middle" class="box-title">SQL Server</text>
  <text x="950" y="848" text-anchor="middle" class="box-body" fill="#0b4f6c">Read-only access</text>

  <path class="edge-green" d="M370 660 L370 704 L235 704 L235 755"/>
  <rect class="label-bg" x="382" y="693" width="156" height="22"/><text x="460" y="709" text-anchor="middle" class="box-body" fill="#2e7d32">Approved tool execution</text>

  <path class="edge-teal" d="M360 793 L460 793"/>
  <path class="edge-blue" d="M730 793 L835 793"/>
  <rect class="label-bg" x="734" y="758" width="134" height="22"/><text x="801" y="774" text-anchor="middle" class="box-body" fill="#0b4f6c">Read-only data access</text>

  <path class="edge-return" d="M110 793 L60 793 L60 610 L110 610"/>
  <rect class="label-bg" x="74" y="674" width="182" height="44"/><text x="165" y="690" text-anchor="middle" class="box-body" fill="#64748b">Protected tool result</text><text x="165" y="708" text-anchor="middle" class="box-body" fill="#64748b">returns to application</text>

  <path class="edge-return" d="M110 560 L60 560 L60 227 L130 227"/>
  <rect class="label-bg" x="70" y="402" width="142" height="44"/><text x="141" y="418" text-anchor="middle" class="box-body" fill="#64748b">Final answer</text><text x="141" y="436" text-anchor="middle" class="box-body" fill="#64748b">shown to user</text>
</svg>
