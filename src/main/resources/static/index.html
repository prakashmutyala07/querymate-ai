<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QueryMate AI</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app-shell">
    <header class="masthead">
        <div class="brand">
            <span class="mark" aria-hidden="true">
                <svg viewBox="0 0 32 32" role="img">
                    <path class="logo-db" d="M10 11.5c0-1.8 2.7-3.25 6-3.25s6 1.45 6 3.25v8.8c0 1.8-2.7 3.25-6 3.25s-6-1.45-6-3.25z"/>
                    <path class="logo-db-line" d="M10 11.5c0 1.8 2.7 3.25 6 3.25s6-1.45 6-3.25M10 16c0 1.8 2.7 3.25 6 3.25s6-1.45 6-3.25"/>
                    <path class="logo-spark" d="M23.8 6.7l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7zM8 21.2l.5 1.2 1.2.5-1.2.5-.5 1.2-.5-1.2-1.2-.5 1.2-.5z"/>
                    <path class="logo-chat" d="M7.2 9.3h3.6M7.2 12h2.4"/>
                </svg>
            </span>
            <div>
                <h1>QueryMate AI</h1>
                <p class="subtitle">Ask questions and get answers from your data</p>
            </div>
        </div>
        <div class="session-strip" aria-label="Session status">
            <span id="connectionStatus">Connecting...</span>
            <span><strong id="toolCount">...</strong> tools</span>
            <span>8 tables</span>
            <span>Read-only</span>
            <span id="modelName">Waiting for model</span>
        </div>
        <div class="actions">
            <button id="clearMemoryButton" type="button" class="ghost-button">Clear</button>
            <button id="newConversationButton" type="button" class="ghost-button primary">New chat</button>
        </div>
    </header>

    <main class="workspace">
        <section id="thread" class="thread" aria-live="polite">
            <section class="empty" id="emptyState">
                <p class="eyebrow">QueryMate AI</p>
                <h2>Ask questions and get answers from your data</h2>
                <div class="suggestions">
                    <button type="button" class="suggestion">Top 5 products by revenue</button>
                    <button type="button" class="suggestion">Show recent orders</button>
                    <button type="button" class="suggestion">List customers by city</button>
                    <button type="button" class="suggestion">Monthly sales summary</button>
                </div>
            </section>
        </section>

        <div class="composer-dock">
            <form id="chatForm" class="composer">
                <label class="sr-only" for="messageInput">Message</label>
                <textarea id="messageInput" rows="1" autocomplete="off" placeholder="Ask anything about your data..."></textarea>
                <button id="sendButton" type="submit" aria-label="Send">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                </button>
            </form>
        </div>
    </main>
</div>
<script src="/app.js" defer></script>
</body>
</html>
