<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QueryMate AI</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app-shell">
    <header class="masthead">
        <div class="brand">
            <span class="mark" aria-hidden="true">
                <svg viewBox="0 0 40 40">
                    <defs>
                        <linearGradient id="querymateLogoGradient" x1="7" y1="5" x2="34" y2="36" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#7fb4ff"/>
                            <stop offset=".54" stop-color="#39d0bf"/>
                            <stop offset="1" stop-color="#9b8cff"/>
                        </linearGradient>
                    </defs>
                    <path class="logo-q-ring" stroke="url(#querymateLogoGradient)" d="M20 7.2a12.8 12.8 0 1 0 7.7 23l4 3.8"/>
                    <path class="logo-q-tail" stroke="url(#querymateLogoGradient)" d="M27.2 27.8l5.6 5.1"/>
                    <path class="logo-db-body" d="M13.3 16.2c0-1.8 3-3.3 6.7-3.3s6.7 1.5 6.7 3.3v7.1c0 1.8-3 3.3-6.7 3.3s-6.7-1.5-6.7-3.3z"/>
                    <path class="logo-db-lines" d="M13.3 16.2c0 1.8 3 3.3 6.7 3.3s6.7-1.5 6.7-3.3M13.3 19.8c0 1.8 3 3.3 6.7 3.3s6.7-1.5 6.7-3.3"/>
                    <path class="logo-node-line" d="M9.8 13.7l3.6-2.2M27.2 10.1l3.2-2.4M29.3 18.3l3.6 1.9"/>
                    <circle class="logo-node" cx="9.8" cy="13.7" r="1.35"/>
                    <circle class="logo-node" cx="13.4" cy="11.5" r="1.35"/>
                    <circle class="logo-node" cx="27.2" cy="10.1" r="1.25"/>
                    <circle class="logo-node" cx="30.4" cy="7.7" r="1.25"/>
                    <circle class="logo-node" cx="32.9" cy="20.2" r="1.25"/>
                    <path class="logo-spark" d="M30.4 13.2l.55 1.35 1.35.55-1.35.55-.55 1.35-.55-1.35-1.35-.55 1.35-.55z"/>
                </svg>
            </span>
            <div>
                <h1>QueryMate AI</h1>
                <p class="subtitle">Ask your database</p>
            </div>
        </div>
        <div class="session-strip" aria-label="Session status">
            <span id="connectionStatus">Connecting...</span>
            <span><strong id="toolCount">...</strong> tools</span>
            <span>8 tables</span>
            <span>Read-only</span>
            <span id="modelName">Waiting for model</span>
        </div>
        <div class="actions">
            <button id="clearMemoryButton" type="button" class="ghost-button">Clear</button>
            <button id="newConversationButton" type="button" class="ghost-button primary">New chat</button>
        </div>
    </header>

    <main class="workspace">
        <section id="thread" class="thread" aria-live="polite">
            <section class="empty" id="emptyState">
                <p class="eyebrow">QueryMate AI</p>
                <h2>Ask questions and get answers from your data</h2>
                <div class="suggestions">
                    <button type="button" class="suggestion">Top 5 products by revenue</button>
                    <button type="button" class="suggestion">Show recent orders</button>
                    <button type="button" class="suggestion">List customers by city</button>
                    <button type="button" class="suggestion">Monthly sales summary</button>
                </div>
            </section>
        </section>

        <div class="composer-dock">
            <form id="chatForm" class="composer">
                <label class="sr-only" for="messageInput">Message</label>
                <textarea id="messageInput" rows="1" autocomplete="off" placeholder="Ask anything about your data..."></textarea>
                <button id="sendButton" type="submit" aria-label="Send">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                </button>
            </form>
        </div>
    </main>
</div>
<script src="/app.js" defer></script>
</body>
</html>
