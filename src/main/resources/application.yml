spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: querymate-ai
  ai:
    model:
      chat: openai
      embedding: none
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${APP_MODELS_PRIMARY:gpt-4.1-mini}
    mcp:
      client:
        enabled: true
        name: querymate-ai
        version: 0.0.1
        initialized: true
        request-timeout: 30s
        type: SYNC
        # Raw callbacks must NOT become model-level defaults: the SensitiveDataGuard-wrapped
        # copies are supplied per request instead. See McpToolCatalog.
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            dab:
              url: ${DAB_MCP_BASE_URL:http://localhost:5000}
              endpoint: ${DAB_MCP_ENDPOINT:/mcp}
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false
    tools:
      throw-exception-on-error: false
      limits:
        max-calls-per-tool-default: 8
        max-calls-per-tool:
          describe_entities: 3
          read_records: 12
          aggregate_records: 5
        max-total-tool-calls: 20
        on-limit-exceeded: RETURN_ERROR_RESPONSE

app:
  chat:
    max-message-chars: ${APP_CHAT_MAX_MESSAGE_CHARS:8000}
  models:
    primary: ${APP_MODELS_PRIMARY:gpt-4.1-mini}
    fallback: ${APP_MODELS_FALLBACK:gpt-4.1-nano}
  execution:
    fallback-enabled: ${APP_FALLBACK_ENABLED:true}
    primary-retry-enabled: ${APP_PRIMARY_RETRY_ENABLED:false}
    max-completion-tokens: ${APP_MAX_COMPLETION_TOKENS:1200}
    temperature: ${APP_TEMPERATURE:0.1}
    request-timeout: ${APP_REQUEST_TIMEOUT:30s}
    # json_schema makes the provider enforce the response shape, so the schema no longer has to
    # be appended to the system prompt and asked for politely. prompt_json remains available for
    # providers that cannot enforce it.
    response-format: ${APP_RESPONSE_FORMAT:json_schema}
  memory:
    max-messages: ${APP_MEMORY_MAX_MESSAGES:20}
  ai:
    trace:
      enabled: ${APP_AI_TRACE_ENABLED:false}
      include-sensitive-values: ${APP_AI_TRACE_INCLUDE_SENSITIVE_VALUES:false}
      max-payload-chars: ${APP_AI_TRACE_MAX_PAYLOAD_CHARS:20000}
  security:
    detection:
      phone-region: ${APP_PII_PHONE_REGION:US}
      # Keep false unless the OpenNLP model is packaged; when true, startup fails instead of
      # silently running without local person-name detection.
      require-person-name-model: ${APP_REQUIRE_PERSON_NAME_MODEL:false}
    limits:
      max-tool-result-bytes: ${APP_MAX_TOOL_RESULT_BYTES:1000000}
      max-egress-bytes: ${APP_MAX_EGRESS_BYTES:2000000}
      max-rows: ${APP_MAX_ROWS:25}
    # Deny-by-default for rows returned by the row-data tools: any column not listed here
    # is protected before the model sees it, so a column added by a later migration fails
    # closed instead of being forwarded. Widen this list deliberately, never by reflex.
    data-policy:
      safe-columns:
        - count
      safe-fields-by-entity:
        Customer:
          - CustomerId
          - City
          - StateProvince
          - Country
          - LoyaltyTier
        Category:
          - CategoryId
          - CategoryName
        Product:
          - ProductId
          - CategoryId
          - ProductName
          - UnitPrice
          - Cost
          - InventoryQuantity
        Order:
          - OrderId
          - CustomerId
          - OrderDate
          - OrderStatus
          - Subtotal
          - TaxAmount
          - ShippingAmount
          - TotalAmount
          - SalesChannel
        OrderItem:
          - OrderItemId
          - OrderId
          - ProductId
          - Quantity
          - UnitPrice
          - DiscountAmount
          - LineTotal
        Payment:
          - PaymentId
          - OrderId
          - Amount
          - Status
        Shipment:
          - ShipmentId
          - OrderId
          - Status
        Review:
          - ReviewId
          - CustomerId
          - ProductId
          - Rating
      # This overrides safe-columns for a numeric column when a deployment needs stricter handling.
      sensitive-numeric-columns: []
  # entity.field pairs protected before any tool result reaches the model. These stay
  # explicit so their token type is CustomerName/Email/Phone rather than the generic
  # SensitiveValue label the deny-by-default path assigns.
  sensitive-fields:
    - entity: Customer
      field: FullName
    - entity: Customer
      field: Email
    - entity: Customer
      field: Phone

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.ai.querymateai: ${APP_LOG_LEVEL:INFO}
    com.ai.querymateai.chat: ${APP_CHAT_LOG_LEVEL:INFO}
    com.ai.querymateai.security: ${APP_SECURITY_LOG_LEVEL:INFO}
    com.ai.querymateai.mcp: ${APP_MCP_LOG_LEVEL:INFO}
